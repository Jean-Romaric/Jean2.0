<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            background: blue;
        }

        button {
            transition: 0.3s;
        }

        button:hover {
            background: red;
        }

        #sendBtn:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>

<body>
    <div class="box">Salut</div>
    <button id="sendBtn" disabled>
        Envoyer
    </button>
</body>

</html>
