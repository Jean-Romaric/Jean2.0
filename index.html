<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jean2.0</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #f2f2f2;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (min-width: 768px) {
            body {
                height: 100vh;
            }
        }

        .chat-container {
            width: 90%;
            max-width: 500px;
            height: 85vh;
            background-color: #FFF;
            border-radius: 20px;
            box-shadow: 1px 1px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(270deg, #ff6ec4, #7873f5, #4ADEDE);
            background-size: 800% 800%;
            animation: gradientMove 6s ease infinite;
            color: #fff;
            padding: 20px;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .chat-header .status {
            font-size: 12px;
            opacity: 0.8;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: #f5f5f5;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 75%;
            padding: 12px 18px;
            border-radius: 18px;
            word-wrap: break-word;
            line-height: 1.5;
            white-space: pre-wrap; /* Conserve les sauts de ligne de Gemini */
        }

        .message.bot .message-content {
            background-color: #fff;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 1px 1px 20px rgba(0, 0, 0, 0.1);
        }

        .message.user .message-content {
            background-color: #000;
            color: #fff;
            border-bottom-right-radius: 4px;
            box-shadow: 1px 1px 20px rgba(0, 0, 0, 0.1);
        }

        .message.error .message-content {
            background-color: #fff;
            color: #ce2525;
            border-left: 4px solid #ce2525;
        }

        .chat-input-container {
            padding: 20px;
            background-color: #fff;
            display: flex;
            gap: 10px;
        }

        #userInput {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #ebebeb;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: border 0.3s;
        }

        #userInput:focus {
            border-color: #667eea;
        }

        #sendBtn {
            padding: 12px 20px;
            background: #000;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s;
        }

        #sendBtn:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }

        .typing-indicator {
            display: none;
            padding: 10px;
            background-color: #fff;
            border-radius: 18px;
            width: fit-content;
            box-shadow: 1px 1px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 15px;
        }

        .typing-indicator.active {
            display: block;
        }

        .typing-indicator span {
            height: 5px;
            width: 5px;
            background-color: #000;
            border-radius: 50%;
            display: inline-block;
            margin: 0 3px;
            animation: typing 1.5s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: .2s; }
        .typing-indicator span:nth-child(3) { animation-delay: .4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>

<body>
    <div class="h-dvh md:h-screen chat-container">
        <div class="chat-header">
            <h1>Jean2.0</h1>
            <div class="status" id="statusText">Prêt à discuter</div>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="message-content">
                    Bonjour! Je suis Jean2.0, ton assistant IA personnalisé. Comment puis-je t'aider aujourd'hui ?
                </div>
            </div>
            <div class="typing-indicator" id="typingIndicator">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
        <div class="chat-input-container">
            <input type="text" id="userInput" placeholder="Tapez votre message ici..." autocomplete="off">
            <button id="sendBtn">Envoyer</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById("chatMessages");
        const userInput = document.getElementById("userInput");
        const sendBtn = document.getElementById("sendBtn");
        const typingIndicator = document.getElementById("typingIndicator");
        const statusText = document.getElementById("statusText");

        const CHAT_API_URL = "http://localhost:3000/api/chat";

        function addMessage(message, isUser, isError = false) {
            const messageDiv = document.createElement("div");
            messageDiv.className = `message ${isUser ? "user" : isError ? "error" : "bot"}`;

            const messageContent = document.createElement("div");
            messageContent.className = "message-content";
            messageContent.textContent = message;

            messageDiv.appendChild(messageContent);
            chatMessages.insertBefore(messageDiv, typingIndicator);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showTyping() {
            typingIndicator.classList.add("active");
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function hideTyping() {
            typingIndicator.classList.remove("active");
        }

        async function callChatApi(message) {
            const response = await fetch(CHAT_API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({ prompt: message }),
            });

            let data;
            try {
                data = await response.json();
            } catch {
                if (response.ok) {
                    throw new Error("La réponse de l'API n'est pas un JSON valide.");
                }
            }

            if (!response.ok) {
                const apiError = typeof data?.error === "string"
                    ? data.error
                    : data?.error?.message;
                throw new Error(apiError || `L'API a répondu avec le statut ${response.status}.`);
            }

            if (typeof data?.reply !== "string" || !data.reply.trim()) {
                throw new Error("La réponse de l'API ne contient pas de champ « reply » valide.");
            }

            return data.reply;
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (message === "") return;

            userInput.disabled = true;
            sendBtn.disabled = true;

            addMessage(message, true);
            userInput.value = "";

            showTyping();
            statusText.textContent = "Jean2.0 réfléchit...";

            try {
                const response = await callChatApi(message);
                hideTyping();
                addMessage(response, false);
                statusText.textContent = "En ligne";
            } catch (error) {
                hideTyping();
                statusText.textContent = "Erreur de connexion";
                addMessage(`Erreur de l'API : ${error.message}`, false, true);
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        sendBtn.addEventListener("click", sendMessage);
        userInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter" && !userInput.disabled) {
                sendMessage();
            }
        });

        userInput.focus();
    </script>
</body>

</html>
